services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
    container_name: raymond-api
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${DB_USER:-raymond}:${DB_PASSWORD:-raymond_password}@raymond-postgres:5432/${DB_NAME:-raymond_db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - API_PORT=${API_PORT:-8001}
      - PORT=${PORT:-8001}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-true}
      - REDIS_HOST=raymond-redis
      - REDIS_PORT=6379
      - TALLER_R1_DATABASE_URL=${TALLER_R1_DATABASE_URL}
      - FRONTERA_DATABASE_URL=${FRONTERA_DATABASE_URL}
      - NAVES_DATABASE_URL=${NAVES_DATABASE_URL}
      - COMERCIAL_R4_DATABASE_URL=${COMERCIAL_R4_DATABASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-raymond_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-raymond_secret_2024}
      - STORAGE_TYPE=${STORAGE_TYPE:-s3}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-raymond_admin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-raymond_secret_2024}
      - S3_BUCKET=${S3_BUCKET:-comercial-r4}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://raymond-minio:9000}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-raymond-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-raymond_admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-raymond_secret_2024}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9002}
      
    restart: unless-stopped
    networks:
      - raymond-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001/api}
    container_name: raymond-web
    ports:
      - "8003:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://api:8001/api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - raymond-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: raymond-redis
    ports:
      - "6381:6379"
    networks:
      - raymond-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: raymond-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-raymond}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-raymond_password}
      - POSTGRES_DB=${DB_NAME:-raymond_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - raymond-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-raymond} -d ${DB_NAME:-raymond_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: raymond-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-raymond_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-raymond_secret_2024}
      - STORAGE_TYPE=${STORAGE_TYPE:-s3}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-raymond_admin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-raymond_secret_2024}
      - S3_BUCKET=${S3_BUCKET:-comercial-r4}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://raymond-minio:9000}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-raymond-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-raymond_admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-raymond_secret_2024}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9002}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - raymond-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  raymond-network:
    driver: bridge
volumes:
  minio_data:
  postgres_data:
